name: Release New Version

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type'
        required: true
        default: 'patch'

permissions:
  # Push the version commit and create the GitHub release.
  contents: write
  # Lets npm authenticate with a short-lived OIDC token via trusted
  # publishing, once it is configured for this package on npmjs.com.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Tag release
        run: npm version ${{ github.event.inputs.releaseType }}

        # Sets new package version as ${{ env.PACKAGE_VERSION }}
      - uses: jozsefsallai/node-package-version@v1.0.4

      # Publish before pushing the version commit, so a failed publish leaves
      # main untouched and the release can simply be re-run.
      - name: Publish to NPM
        run: npm publish
        env:
          # Used only if trusted publishing is not configured for the package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push tag commit
        run: |
          git push

      - name: Prepare Web Artifacts
        run: zip secure-file-transfer-web-${{ env.PACKAGE_VERSION }}.zip -r dist/*

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          name: ${{ env.PACKAGE_VERSION }}
          draft: false
          prerelease: false
          # Fail instead of silently publishing a release without the zip.
          fail_on_unmatched_files: true
          files: |
            ./secure-file-transfer-web-${{ env.PACKAGE_VERSION }}.zip
